version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: cdms-minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cdms-network

  # MinIO Client (MC) - for bucket creation
  minio-mc:
    image: minio/mc:latest
    container_name: cdms-minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/cdms-evidence --ignore-existing;
      /usr/bin/mc anonymous set download myminio/cdms-evidence;
      exit 0;
      "
    networks:
      - cdms-network

volumes:
  minio-data:
    driver: local

networks:
  cdms-network:
    driver: bridge

